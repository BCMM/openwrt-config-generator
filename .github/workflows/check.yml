name: Check for new OpenWrt Docker images
on:
  # schedule:
  #   - cron: "12 02 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      tags: ${{ steps.compare.outputs.tags }}
    steps:
      - name: List Git tags
        run: |
          set -o pipefail
          git ls-remote --tags \
            https://${{ secrets.OPENWRT_CONFIG_COMMIT }}:x-oauth-basic@github.com/BCMM/default-openwrt-config.git |
          sed -r 's|.*/v(.*)|x86-64-\1|' |
          sort -V >git
      - name: List Docker tags
        run: |
          set -o pipefail
          skopeo list-tags docker://docker.io/openwrt/rootfs |
          jq -r '.["Tags"][] | select(.|test("^x86-64-\\d\\d\\.\\d\\d\\.\\d{1,2}$"))' |
          sort -V >docker
      - name: Compare versions
        id: compare
        run: |
          set -o pipefail
          echo -n 'tags=' >> "$GITHUB_OUTPUT"
          comm --nocheck-order -2 -3 docker git |
          jq -nRc '[inputs]' >> "$GITHUB_OUTPUT"
  call:
    runs-on: ubuntu-26.04
    needs: check
    strategy:
      matrix:
        tag: ${{ fromJson(needs.check.outputs.tags) }}
    steps:
      - name: test
        run: |
          echo ${{ matrix.tag }}
      # - name: generate
      #   uses: ./.github/workflows/generate.yaml
      #   with:
      #     tag: ${{ matrix.tag }}
