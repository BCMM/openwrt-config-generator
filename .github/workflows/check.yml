name: Check for new OpenWrt Docker images
on:
  # schedule:
  #   - cron: "12 02 * * *"
  workflow_dispatch:
    inputs:
      branches:
        required: false
        type: string
concurrency:
  group: check
jobs:
  check:
    name: Check GHCR for new versions of OpenWrt
    runs-on: ubuntu-26.04
    outputs:
      tags: ${{ steps.compare.outputs.tags }}
      branches: ${{ steps.passthrough.outputs.branches }}
    env:
      branches: ${{ inputs.branches || 'router client' }}
    steps:
      - name: Pass input through
        id: passthrough
        run: echo "branches=${branches}" >> "$GITHUB_OUTPUT"
      - name: List Git tags
        run: |
          set -o pipefail
          git=$(
            git ls-remote --tags \
              https://${{ secrets.OPENWRT_CONFIG_COMMIT }}:x-oauth-basic@github.com/BCMM/default-openwrt-config.git
          )
          for branch in $branches; do
            echo $git |
            sed -nr "s|.*refs/tags/${branch}/(.*)|x86-64-\1|p" |
            sort -V >git.$branch
            if [ -n "$prev" ] && ! diff git.$branch git.$prev; then
                echo "::error title=Branches not in sync::${branch} and ${prev} do not contain the same versions."
                exit 1
            fi
            $prev = $branch
            cp git.$branch git
          done
      - name: List Docker tags
        run: |
          set -o pipefail
          skopeo list-tags docker://ghcr.io/openwrt/rootfs |
          jq -r '.["Tags"][] | select(.|test("^x86-64-\\d\\d\\.\\d\\d\\.\\d{1,2}$"))' |
          sort -V >docker
      - name: Compare versions
        id: compare
        run: |
          set -o pipefail
          echo -n 'tags=' >> "$GITHUB_OUTPUT"
          comm --nocheck-order -2 -3 docker git |
          jq -nRc '[inputs]' >> "$GITHUB_OUTPUT"
  call:
    name: Launch job
    needs: check
    uses: ./.github/workflows/generate.yml
    secrets: inherit
    strategy:
      matrix:
        tag: ${{ fromJson(needs.check.outputs.tags) }}
      max-parallel: 1
    with:
      tag: ${{ matrix.tag }}
      branches: ${{ needs.check.outputs.branches }}
      # Hopefully less likely to rate-limit GH runners than docker.io
      container: ghcr.io/openwrt/rootfs
